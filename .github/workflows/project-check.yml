name: Check project requirements

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.repository != 'rtealwitter/project-template'
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Download the course checker
        run: |
          curl --fail --location --silent --show-error \
            https://csci145.rtealwitter.com/tools/project_grader/check_project.py \
            --output "$RUNNER_TEMP/check_project.py"

      - name: Check repository
        run: |
          python "$RUNNER_TEMP/check_project.py" \
            --repository "$GITHUB_REPOSITORY" \
            .
